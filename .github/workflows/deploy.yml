name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Sync to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          # Replace CluelessCoder26/deepfake-backend with your actual Hugging Face Space ID if different
          huggingface_repo_id: CluelessCoder26/deepfake-backend
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space

