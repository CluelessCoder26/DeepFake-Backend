name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'YOUR_SPACE_NAME' below with your actual Hugging Face Space name
          git push --force https://CluelessCoder26:$HF_TOKEN@huggingface.co/spaces/CluelessCoder26/YOUR_SPACE_NAME main
